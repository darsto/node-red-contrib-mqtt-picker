<script type="text/x-red" data-template-name="mqtt-db-in">
  <div class="form-row">
    <label for="node-input-topic"><i class="fa fa-tasks"></i> Topic</label>
    <div style="width: 70%; display: inline-flex;">
        <input type="text" id="node-input-topic" style="flex-grow: 1" placeholder="Topic" autocomplete="off">
        <a id="node-input-topic-pickbtn" class="red-ui-button" style="margin-left: 10px;"><i class="fa fa-folder-open"></i></a>
    </div>
  </div>

  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name">
  </div>

  <div class="form-tips"># sends each updated leaf across all topics.<br>device sends the whole updated device.<br>device.# sends each updated leaf.<br>device.SENSOR sends the whole updated SENSOR object.</div>
</script>

<script type="text/x-red" data-help-name="mqtt-db-in">
  <p>Subscribe to received device state. Exact paths return the complete selected value; a final .# returns individual updated leaves. Use # by itself for updated leaves across all topics. Commands and manual removals do not emit state updates.</p>
</script>

<script type="text/javascript">
  RED.nodes.registerType("mqtt-db-in", {
    category: "common",
    color: "#8fbaf7",
    defaults: {
      topic: { value: "", required: true },
      name: { value: "" },
    },
    outputs: 1,
    icon: "font-awesome/fa-database",
    label: function () {
      return this.name || this.topic || "mqtt-db in";
    },
    paletteLabel: function () {
      return "mqttdb in";
    },
    oneditprepare: function () {
      document.querySelector("#node-input-topic-pickbtn").onclick =
        (e) => window.open_mqtt_topic_picker(e, { subscribe: true });
    },
  });
</script>
