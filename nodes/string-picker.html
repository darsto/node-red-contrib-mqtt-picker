<script type="text/x-red" data-template-name="string-picker">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name">
  </div>
  <div class="form-row">
    <label for="node-input-topic"><i class="fa fa-font"></i> Value</label>
    <div style="width: 70%; display: inline-flex;">
        <input type="text" id="node-input-topic" style="flex-grow: 1" placeholder="Topic" autocomplete="off">
        <a id="node-input-topic-pickbtn" class="red-ui-button" style="margin-left: 10px;"><i class="fa fa-pencil"></i></a></div>
    </div>
  </div>
</script>

<script type="text/x-red" data-help-name="string-picker">
  <p>A node that stores a string. Click the "Pick" button to choose one of the hard-coded options.</p>
</script>

<script src="resources/node-red-contrib-mqtt-picker/treeview.js"></script>
<link rel="stylesheet" href="resources/node-red-contrib-mqtt-picker/treeview.css">

<script type="text/javascript">
  RED.nodes.registerType('string-picker',{
    category: 'function',
    color: '#a6bbcf',
    defaults: {
      name: {value: ""},
      topic: {value: ""}
    },
    inputs:1,
    outputs:1,
    icon: "font-awesome/fa-font",
    label: function() {
      return this.name || this.picked || "string-picker";
    },
    oneditprepare: function() {
      var node = this;
      document.querySelector("#node-input-topic-pickbtn").onclick = (e) => {
        e.preventDefault();

        var treeData = [
          {id: 'A', children: [
            {id: 'A.1'},
            {id: 'A.2'}
          ]},
          {id: 'B', children: [
            {id: 'B.1', children: [
              {id: 'B.1.1'},
              {id: 'B.1.2'}
            ]},
            {id: 'B.2'}
          ]},
          {id: 'C'}
        ];

        let _selectedValue = null;

        function buildTree(nodes) {
          var div = document.createElement('div');
          div.id = "sp-mqtt-picker";

            try {
              var tree = new Treeview({
                container: div,
                data: nodes,
                nodeNameKey: "id",
                searchEnabled: true,
                initiallyExpanded: false,
                multiSelectEnabled: false,
                onSelectionChange: function(selectedArray) {
                  if (selectedArray && selectedArray.length > 0) {
                    _selectedValue = selectedArray[0].id;
                  } else {
                    _selectedValue = null;
                  }
                },
                onRenderNode: function(nodeData, nodeContentWrapperElement) {
                  nodeContentWrapperElement.innerHTML = '';
                  var span = document.createElement('span');
                  span.className = 'treeview-node-text';
                  const lastDotPos = nodeData.id.lastIndexOf(".");
                  const name = nodeData.id.substring(lastDotPos + 1);
                  span.textContent = name;
                  nodeContentWrapperElement.appendChild(span);
                }
              });
            } catch (e) {
              console.error('Quercus Treeview initialization failed:', e);
            }

          return div;
        }

        var content = document.createElement("div");
        content.class="string-picker-dialog";
        content.style="padding: 8px";
        var tree = buildTree(treeData);
        tree.style = "max-height: 320px; overflow: auto; border: 1px solid #ddd; padding: 8px; background:#fff;";
        content.append(tree);

        var d = $(content).dialog({
          title: 'Pick a string',
          modal: true,
          width: "90vw",
          minHeight: "90vh",
          buttons: {
            Ok: function() {
              var val = (typeof _selectedValue !== 'undefined' && _selectedValue !== null) ? _selectedValue : content.find('.sp-leaf.sp-selected').data('value');
              if (val !== undefined) {
                document.querySelector("#node-input-topic").value = val;
              }
              d.dialog('close').remove();
            },
            Cancel: function() { d.dialog('close').remove(); }
          },
          close: function(){ this.remove(); }
        });
      };
    }
  });
</script>
