<script type="text/x-red" data-template-name="mqtt-db-call">
  <div class="form-row">
    <label for="node-input-topic"><i class="fa fa-tasks"></i> Topic</label>
    <div style="width: 70%; display: inline-flex;">
        <input type="text" id="node-input-topic" style="flex-grow: 1" placeholder="Topic" autocomplete="off">
        <a id="node-input-topic-pickbtn" class="red-ui-button" style="margin-left: 10px;"><i class="fa fa-folder-open"></i></a>
    </div>
  </div>

  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name">
  </div>

  <div class="form-row">
    <label for="node-input-attr"><i class="fa fa-tag"></i> Attribute</label>
    <input type="text" id="node-input-attr" placeholder="payload">
  </div>

  <div class="form-row">
    <label for="node-input-requestlatest"><i class="fa fa-refresh"></i> Query device</label>
    <input type="checkbox" id="node-input-requestlatest" style="width: auto;">
  </div>

  <div class="form-row">
    <label for="node-input-timeout">Timeout (ms)</label>
    <input type="number" id="node-input-timeout" min="1" placeholder="5000">
  </div>

  <div class="form-row">
    <label for="node-input-noexist"><i class="fa fa-question"></i> Return error when Object does not exist</label>
    <select id="node-input-noexist" style="width: 70%;">
      <option value="error">Return Error</option>
      <option value="undef">Return undefined</option>
      <option value="nothing">Return nothing</option>
    </select>
  </div>

  <div class="form-tips"><b>Tip:</b> Leave topic blank if you want to set them via msg properties.</div>
</script>

<script type="text/x-red" data-help-name="mqtt-db-call">
  <p>Read a cached device, object, or leaf. Query device sends an empty command only for prefix-bearing device.suffix paths and waits for a matching update. It does not guarantee fresh measurement. Generic and nested queries are unsupported; one query per device may run at a time.</p>
</script>

<script type="text/javascript">
  RED.nodes.registerType("mqtt-db-call", {
    category: "common",
    color: "#8fbaf7",
    defaults: {
      topic: { value: "" },
      name: { value: "" },
      attr: { value: "" },
      requestlatest: { value: false },
      timeout: { value: 5000, validate: (v) => !v || v < 100000 },
      noexist: { value: "nothing" },
    },
    inputs: 1,
    outputs: 1,
    icon: "font-awesome/fa-database",
    label: function () {
      return this.name || this.topic || "mqtt-db call";
    },
    paletteLabel: function () {
      return "mqttdb call";
    },
    oneditprepare: function () {
      document.querySelector("#node-input-topic-pickbtn").onclick =
        window.open_mqtt_topic_picker;
      const requestLatest = document.querySelector("#node-input-requestlatest");
      const timeout = document.querySelector("#node-input-timeout");
      const updateTimeout = () => { timeout.disabled = !requestLatest.checked; };
      requestLatest.addEventListener("change", updateTimeout);
      updateTimeout();
    },
  });
</script>
