<script type="text/x-red" data-template-name="mqtt-db-out">
  <div class="form-row">
    <label for="node-input-topic"><i class="fa fa-tasks"></i> Topic</label>
    <div style="width: 70%; display: inline-flex;">
        <input type="text" id="node-input-topic" style="flex-grow: 1" placeholder="Topic" autocomplete="off">
        <a id="node-input-topic-pickbtn" class="red-ui-button" style="margin-left: 10px;"><i class="fa fa-folder-open"></i></a>
    </div>
  </div>

  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name">
  </div>

  <div class="form-row">
    <label for="node-input-fullTopic">Full Topic</label>
    <input type="text" id="node-input-fullTopic" placeholder="Optional: pattern for an unknown device">
  </div>

  <div class="form-tips"><b>Tip:</b> Leave topic blank if you want to set them via msg properties.</div>
</script>

<script type="text/x-red" data-help-name="mqtt-db-out">
  <p>Publish once to device.suffix using its Full Topic. Nested JSON fields are not destinations. Supply one object payload for a JSON command. Sending never changes cached values. Full Topic is required for an unknown or unassigned legacy device.</p>
</script>

<script type="text/javascript">
  RED.nodes.registerType("mqtt-db-out", {
    category: "common",
    color: "#8fbaf7",
    defaults: {
      topic: { value: "" },
      name: { value: "" },
      fullTopic: { value: "" },
    },
    inputs: 1,
    align: "right",
    icon: "font-awesome/fa-database",
    label: function () {
      return this.name || this.topic || "mqtt-db out";
    },
    paletteLabel: function () {
      return "mqttdb out";
    },
    oneditprepare: function () {
      document.querySelector("#node-input-topic-pickbtn").onclick =
        (e) => window.open_mqtt_topic_picker(e, { publish: true });
    },
  });
</script>
