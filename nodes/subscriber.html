<script type="text/x-red" data-template-name="mqtt-db-subscriber">
  <div class="form-row">
    Connect this node to "mqtt in" and "mqtt out" nodes.
  </div>
</script>

<script type="text/x-red" data-help-name="mqtt-db-subscriber">
  <p>Connect this node to "mqtt in" and "mqtt out" nodes.</p>
</script>


<script src="resources/node-red-contrib-mqtt-picker/treeview.js"></script>
<link
  rel="stylesheet"
  href="resources/node-red-contrib-mqtt-picker/treeview.css"
/>
<script src="resources/node-red-contrib-mqtt-picker/treeview.js"></script>

<script type="text/javascript">
  RED.nodes.registerType("mqtt-db-subscriber", {
    category: "storage",
    color: "burlywood",
    defaults: {
    },
    inputs: 1,
    outputs: 1,
    icon: "font-awesome/fa-podcast",
    label: function () {
      return "mqttdb subscriber";
    },
    paletteLabel: function() {
      return "mqttdb subscriber";
    },
  });

  const set_topic = (topic) => {
    const prev_topic = document.querySelector("#node-input-topic").value;
    document.querySelector("#node-input-topic").value = topic;
    const name = document.querySelector("#node-input-name");
    if (!name.value || name.value == prev_topic) {
      name.value = topic;
    }
  };
  let last_fetch_time = 0;
  let data = null;
  window.open_mqtt_topic_picker = async (e) => {
    e.preventDefault();
    const now = Date.now();
    const fetch_interval_ms = 1000 * 2;
    if (now > last_fetch_time + fetch_interval_ms) {
      let db_data;
      try {
        const resp = await fetch("mqtt-db/data");
        db_data = await resp.json();
      } catch (e) {
        db_data = {}
      }

      data = build_mqtt_tree(db_data);
      last_fetch_time = now;
    }

    const dialog = document.createElement("div");
    const tree_div = document.createElement("div");
    tree_div.id = "sp-mqtt-picker";
    tree_div.style =
      "border: none; padding: 0; box-shadow: none; max-width: none; margin: 0;";
    dialog.append(tree_div);

    let selected = null;
    let $dialog = null;
    const tree = new Treeview({
      container: tree_div,
      data,
      nodeNameKey: "id",
      searchEnabled: true,
      initiallyExpanded: false,
      multiSelectEnabled: false,
      onSelectionChange: (selectedArray) => {
        if (selectedArray && selectedArray.length > 0) {
          selected = selectedArray[0].id;
          localStorage.setItem("mqttdb-last-selected", selected);
        } else {
          selected = null;
        }
      },
      onRenderNode: (nodeData, nodeContentWrapperElement) => {
        nodeContentWrapperElement.innerHTML = "";
        const nameEl = document.createElement("span");
        nameEl.className = "name";
        const lastDotPos = nodeData.id.lastIndexOf(".");
        const name = nodeData.id.substring(lastDotPos + 1);
        nameEl.textContent = name;
        let nameExtraHTML = "";
        if (nodeData.writable) {
          nameEl.innerHTML += "<span title='Writable'> 📝</span>";
        }
        const removeBtn = document.createElement("span");
        removeBtn.className = "remove";
        removeBtn.title = "Remove node";
        removeBtn.textContent = " 🗑️";
        removeBtn.onclick = async (e) => {
          e.preventDefault();
          e.stopPropagation();
          if (confirm(`Are you sure you want to remove node ${name}`)) {
            console.log("remove");
            const res = await fetch("mqtt-db/data", {
              method: "POST",
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({
                action: "remove",
                id: nodeData.id,
              })
            });
            const db_data = await res.json();
            data = build_mqtt_tree(db_data);
            last_fetch_time = now;
            $dialog.dialog("close");
            window.open_mqtt_topic_picker(e);
          }
        };
        removeBtn.ondblclick = (e) => {
          e.preventDefault();
          e.stopPropagation();
        };
        nameEl.appendChild(removeBtn);

        nodeContentWrapperElement.appendChild(nameEl);
        const typeEl = document.createElement("span");
        typeEl.className = "type";
        typeEl.textContent = "-";
        nodeContentWrapperElement.appendChild(typeEl);
        const valueEl = document.createElement("span");
        valueEl.className = "value";
        valueEl.textContent = nodeData.value?.toString().trim() || "-";
        nodeContentWrapperElement.appendChild(valueEl);

        nameEl.ondblclick =
          typeEl.ondblclick =
          valueEl.ondblclick =
            () => {
              set_topic(nodeData.id);
              $dialog.dialog("close");
            };
      },
    });

    const selected_id = localStorage.getItem("mqttdb-last-selected");
    if (selected_id) {
      tree.selectNodeById(selected_id, true);
      let node = tree.treeviewContainer.querySelector(`[data-id="${selected_id}"]`)?.parentElement;
      while (node && node?.id != "sp-mqtt-picker") {
        const expander = node.firstElementChild?.firstElementChild;
        if (expander?.className == "treeview-expander") {
          expander.click();
        }
        node = node.parentElement;
      }
    }

    $dialog = $(dialog).dialog({
      title: "MQTT topic picker",
      modal: true,
      minWidth: 300,
      width: Math.min(1020, Math.round(window.innerWidth * 0.9)),
      minHeight: 400,
      height: Math.round(window.innerHeight * 0.9),
      buttons: {
        Ok: () => {
          if (selected) {
            set_topic(selected);
          }
          $dialog.dialog("close");
        },
        Cancel: () => {
          $dialog.dialog("close");
        },
      },
      close: () => {
        dialog.remove();
      },
    });
  };

  const build_mqtt_tree = (obj) => {
    const cmnd = obj.cmnd;
    delete obj.cmnd;

    if (!obj.stat) {
      obj.stat = {};
    }

    const tree = Object.entries(obj).map(([key, value]) => ({
      id: key,
      children: explode_obj(value, key),
    }));

    // merge tele nodes with stat
    const tele_idx = tree.findIndex(p => p.id == "tele");
    const tele = tele_idx >= 0 ? tree.splice(tele_idx, 1)[0] : null;
    const stat_idx = tree.findIndex(p => p.id == "stat");
    const stat = tree[stat_idx];
    for (const tele_dev of (tele?.children || [])) {
      let stat_dev = get_child(stat, tele_dev.id);
      if (!stat_dev) {
        stat_dev = { id: tele_dev.id.replace("tele.", "stat."), children: [] };
        stat.children.push(stat_dev);
      }
      stat_dev.children.push(...tele_dev.children);
    }

    // merge cmnd nodes with stat -> mark matching stat
    // nodes as writable
    const set_writable = (dst, template, prefix) => {
      if (!template || typeof template !== "object") {
        return;
      }
      for (const f in template) {
        let idx = dst.findIndex(o => o.id.endsWith("." + f));
        if (idx < 0) {
          idx = dst.push({ id: prefix + f, children: [] }) - 1;
        }
        dst[idx].writable = true;
        set_writable(dst[idx].children, template[f], prefix + f + ".");
      }
    };
    set_writable(stat.children, cmnd, "stat.");

    // and finally unroll everything in stat
    tree.push(...stat.children);
    tree.splice(stat_idx, 1);

    return tree;
  }

  const get_child = (obj, id) => {
    const dot_id = id.substring(id.lastIndexOf('.'));
    if (!obj?.children) {
      return null;
    }
    const idx = obj.children.findIndex(c => c.id.endsWith(dot_id));
    return idx >= 0 ? obj.children[idx] : null;
  };

  const explode_obj = (obj, prefix = "") => {
    return Object.entries(obj).map(([key, value]) => {
      const id = prefix ? `${prefix}.${key}` : key;
      if (value && typeof value === "object" && !Array.isArray(value)) {
        return {
          id,
          children: explode_obj(value, id),
        };
      }
      return { id, value, children: [] };
    });
  }

</script>
